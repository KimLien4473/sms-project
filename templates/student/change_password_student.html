<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>HỆ THỐNG QUẢN LÝ SINH VIÊN - Change Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-high": "#e7e8ea",

              "on-primary-container": "#eeefff",
              "secondary-fixed-dim": "#bcc7de",
              "secondary-container": "#d5e0f8",
              "on-primary-fixed": "#00174b",
              "inverse-on-surface": "#f0f1f3",
              "primary-container": "#2563eb",
              "on-secondary-fixed": "#111c2d",
              "tertiary-fixed-dim": "#c0c1ff",
              "on-tertiary-fixed-variant": "#2f2ebe",
              "on-tertiary-container": "#f1eeff",
              "on-surface": "#191c1e",
              "error-container": "#ffdad6",
              surface: "#f8f9fb",
              outline: "#737686",
              "outline-variant": "#c3c6d7",
              "on-tertiary": "#ffffff",
              "secondary-fixed": "#d8e3fb",
              "on-secondary-fixed-variant": "#3c475a",
              "surface-container": "#edeef0",
              "on-primary": "#ffffff",
              "inverse-surface": "#2e3132",
              primary: "#004ac6",
              "primary-fixed-dim": "#b4c5ff",
              "on-error": "#ffffff",
              error: "#ba1a1a",
              tertiary: "#3e3fcc",
              secondary: "#545f73",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dbe1ff",
              "on-tertiary-fixed": "#07006c",
              "on-secondary": "#ffffff",
              "tertiary-container": "#585be6",
              "surface-container-highest": "#e1e2e4",
              "tertiary-fixed": "#e1e0ff",
              "surface-dim": "#d9dadc",
              "surface-tint": "#0053db",
              "surface-bright": "#f8f9fb",
              "surface-variant": "#e1e2e4",
              "surface-container-low": "#f3f4f6",
              "on-surface-variant": "#434655",
              "on-secondary-container": "#586377",
              "on-primary-fixed-variant": "#003ea8",
              background: "#f8f9fb",
              "inverse-primary": "#b4c5ff",
              "on-error-container": "#93000a",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              stack_lg: "24px",
              container_padding: "32px",
              sidebar_width: "260px",
              gutter: "24px",
              stack_sm: "8px",
              stack_md: "16px",
              topbar_height: "70px",
            },
            fontFamily: {
              code: ["Inter"],
              "headline-md": ["Inter"],
              "display-lg": ["Inter"],
              "body-md": ["Inter"],
              "headline-sm": ["Inter"],
              "body-lg": ["Inter"],
              "label-md": ["Inter"],
              "display-lg-mobile": ["Inter"],
            },
            fontSize: {
              code: ["13px", { lineHeight: "18px", fontWeight: "400" }],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg": [
                "36px",
                {
                  lineHeight: "44px",
                  letterSpacing: "-0.02em",

                },
              ],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "display-lg-mobile": [
                "28px",
                {
                  lineHeight: "34px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen">
    <!-- SideNavBar (Giống file profile_student.html) -->
    <nav
      class="fixed left-0 top-0 h-screen w-[260px] bg-inverse-surface shadow-sm z-30 flex flex-col h-full py-6"
    >
      <div class="px-6 mb-8 flex items-center gap-3">
        <div
          class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-md"
        >
          <span
            class="material-symbols-outlined text-white"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >school</span
          >
        </div>
        <div>
          <h2
            class="font-headline-sm text-headline-sm font-bold text-white tracking-tight"
          >
            HỆ THỐNG QUẢN LÝ SINH VIÊN
          </h2>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto px-3 space-y-1">
        <!-- Các mục menu giống profile_student.html -->
        <a
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-outline-variant hover:text-white hover:bg-white/5 transition-colors font-body-md text-body-md cursor-pointer duration-200"
          href="/student/profile"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 0"
            >person</span
          >
          Personal Profile
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-outline-variant hover:text-white hover:bg-white/5 transition-colors font-body-md text-body-md cursor-pointer duration-200"
          href="/student/learning_progress"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 0"
            >analytics</span
          >
          Learning Progress
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-white bg-white/10 border-l-4 border-white font-body-md text-body-md cursor-pointer duration-200"
          href="/student/change_password"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >lock</span
          >
          Change Password
        </a>
      </div>
      <div class="px-3 mt-auto pt-4 border-t border-white/10">
        <form action="/student/logout" method="POST" style="display: inline">
          <button
            type="submit"
            class="flex items-center gap-3 px-3 py-2.5 w-full text-left rounded-lg text-outline-variant hover:text-white hover:bg-white/5 transition-colors font-body-md text-body-md cursor-pointer duration-200"
          >
            <span class="material-symbols-outlined">logout</span>
            <span>Logout</span>
          </button>
        </form>
      </div>
    </nav>

    <!-- Main Content Wrapper -->
    <div class="flex-1 ml-[260px] flex flex-col min-h-screen">
      <!-- TopNavBar (Giống file profile_student.html) -->
      <header
        class="fixed top-0 right-0 h-[70px] w-[calc(100%-260px)] bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center px-8 z-20"
      >
        <div class="flex items-center">
          <a href="/student/profile" class="hover:no-underline">
            <h1
              class="font-headline-md text-headline-md font-semibold text-on-surface"
            >
              Change Password
            </h1>
          </a>
        </div>
        <div class="flex items-center space-x-4">
          <button
            class="p-2 text-primary hover:bg-surface-container-high transition-all rounded-full flex items-center justify-center"
          >
            <span
              class="material-symbols-outlined"
              style="font-variation-settings: &quot;FILL&quot; 0"
              >notifications</span
            >
          </button>
          <div
            class="flex items-center space-x-3 pl-4 border-l border-outline-variant"
          >
            <div class="text-right hidden sm:block">
              <p class="font-body-md text-body-md font-bold text-on-surface">
               {{ user_name }}
              </p>
              <p class="font-label-md text-label-md text-on-surface-variant">
                Student
              </p>
            </div>
            <img
              alt="User Avatar"
              class="w-10 h-10 rounded-full object-cover shadow-sm"
              data-alt="..."
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuRc90TnGZ-68BvMnZ8gL3-bO-x3tXo5MoZHIa6mVvzw&s=10"       />
          </div>
        </div>
      </header>

      <!-- Main Content (Nội dung Change Password giữ nguyên) -->
      <main
        class="flex-1 mt-[70px] p-container_padding bg-background overflow-y-auto"
      >
        <div class="max-w-2xl mx-auto mt-stack_lg">
          <div class="mb-stack_lg">
            <h2 class="font-headline-md text-headline-md text-on-surface">
              Security Settings
            </h2>
          </div>
          <!-- Password Form Card -->
          <div
            class="bg-surface-container-lowest rounded-xl border border-outline-variant p-stack_lg shadow-[0px_1px_3px_rgba(0,0,0,0.1)]"
          >
            <form
              class="space-y-stack_lg"
              action="/student/change_password"
              method="POST"
            >
              <div class="space-y-stack_sm">
                <label
                  class="block font-label-md text-label-md text-on-surface"
                  for="current_password"
                  >Current Password</label
                >
                <div class="relative">
                  <input
                    class="w-full rounded-lg border border-outline px-4 py-2 font-body-md text-on-surface focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container outline-none transition-all"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter current password"
                    type="password"
                    required
                  />
                  <button
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"
                    type="button"
                    onclick="togglePasswordVisibility('current_password', this)"
                  >
                    <span
                      class="material-symbols-outlined text-[20px]"
                      data-icon="visibility_off"
                      >visibility_off</span
                    >
                  </button>
                </div>
              </div>
              <div class="border-t border-outline-variant my-stack_lg"></div>
              <div class="space-y-stack_sm">
                <label
                  class="block font-label-md text-label-md text-on-surface"
                  for="new_password"
                  >New Password</label
                >
                <div class="relative">
                  <input
                    class="w-full rounded-lg border border-outline px-4 py-2 font-body-md text-on-surface focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container outline-none transition-all"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    type="password"
                    required
                  />
                  <button
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"
                    type="button"
                    onclick="togglePasswordVisibility('new_password', this)"
                  >
                    <span
                      class="material-symbols-outlined text-[20px]"
                      data-icon="visibility_off"
                      >visibility_off</span
                    >
                  </button>
                </div>
              </div>
              <div class="space-y-stack_sm">
                <label
                  class="block font-label-md text-label-md text-on-surface"
                  for="confirm_password"
                  >Confirm New Password</label
                >
                <div class="relative">
                  <input
                    class="w-full rounded-lg border border-outline px-4 py-2 font-body-md text-on-surface focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container outline-none transition-all"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    type="password"
                    required
                  />
                  <button
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"
                    type="button"
                    onclick="togglePasswordVisibility('confirm_password', this)"
                  >
                    <span
                      class="material-symbols-outlined text-[20px]"
                      data-icon="visibility_off"
                      >visibility_off</span
                    >
                  </button>
                </div>
              </div>
              <div class="pt-stack_md flex justify-end gap-stack_md">
                <a
                  href="/student/profile"
                  class="px-6 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors"
                >
                  Cancel
                </a>
                <button
                  class="px-6 py-2 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary-fixed-variant transition-colors shadow-sm"
                  type="submit"
                >
                  Update Password
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script>
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          btn.querySelector("span").textContent = "visibility";
        } else {
          input.type = "password";
          btn.querySelector("span").textContent = "visibility_off";
        }
      }
    </script>
  </body>
</html>
