<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#edeef0",
              "on-surface": "#191c1e",
              tertiary: "#3e3fcc",
              "primary-fixed-dim": "#b4c5ff",
              "tertiary-fixed-dim": "#c0c1ff",
              "surface-container-low": "#f3f4f6",
              "inverse-surface": "#2e3132",
              "on-tertiary-container": "#f1eeff",
              "secondary-fixed": "#d8e3fb",
              "surface-container-high": "#e7e8ea",
              "secondary-fixed-dim": "#bcc7de",
              outline: "#737686",
              "inverse-primary": "#b4c5ff",
              "surface-bright": "#f8f9fb",
              "on-background": "#191c1e",
              "on-tertiary": "#ffffff",
              "surface-tint": "#0053db",
              "error-container": "#ffdad6",
              "tertiary-container": "#585be6",
              "surface-variant": "#e1e2e4",
              "on-error": "#ffffff",
              "on-secondary-fixed-variant": "#3c475a",
              "outline-variant": "#c3c6d7",
              "on-tertiary-fixed": "#07006c",
              "on-secondary-fixed": "#111c2d",
              "primary-container": "#2563eb",
              "surface-dim": "#d9dadc",
              "primary-fixed": "#dbe1ff",
              "on-primary-fixed-variant": "#003ea8",
              "on-secondary-container": "#586377",
              primary: "#004ac6",
              "surface-container-lowest": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-container": "#d5e0f8",
              "surface-container-highest": "#e1e2e4",
              "on-primary": "#ffffff",
              "inverse-on-surface": "#f0f1f3",
              "on-primary-container": "#eeefff",
              "on-secondary": "#ffffff",
              error: "#ba1a1a",
              "on-primary-fixed": "#00174b",
              secondary: "#545f73",
              surface: "#f8f9fb",
              "on-surface-variant": "#434655",
              "on-tertiary-fixed-variant": "#2f2ebe",
              background: "#f8f9fb",
              "tertiary-fixed": "#e1e0ff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              stack_md: "16px",
              container_padding: "32px",
              stack_sm: "8px",
              sidebar_width: "260px",
              gutter: "24px",
              topbar_height: "70px",
              stack_lg: "24px",
            },
            fontFamily: {
              "body-md": ["Inter"],
              "display-lg-mobile": ["Inter"],
              "headline-sm": ["Inter"],
              code: ["Inter"],
              "headline-md": ["Inter"],
              "display-lg": ["Inter"],
              "body-lg": ["Inter"],
              "label-md": ["Inter"],
            },
            fontSize: {
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "display-lg-mobile": [
                "28px",
                {
                  lineHeight: "34px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              code: ["13px", { lineHeight: "18px", fontWeight: "400" }],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg": [
                "36px",
                {
                  lineHeight: "44px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body
    class="bg-surface-container-low min-h-screen flex items-center justify-center p-4"
  >
    <!-- Card Container -->
    <main
      class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-container_padding flex flex-col items-center"
    >
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div class="w-full mb-4 space-y-2">
        {% for category, message in messages %}
        <div
          class="p-3 rounded-lg text-sm font-medium {% if category == 'ok' %}bg-green-100 text-green-800 border border-green-300 {% elif category == 'err' %}bg-red-100 text-red-800 border border-red-300 {% elif category == 'warn' %}bg-yellow-100 text-yellow-800 border border-yellow-300 {% else %}bg-blue-100 text-blue-800 border border-blue-300{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %}

      <!-- Header -->
      <div class="flex flex-col items-center mb-8 w-full">
        <div
          class="h-12 w-12 bg-primary-fixed rounded-full flex items-center justify-center mb-4 text-on-primary-fixed-variant"
        >
          <span class="material-symbols-outlined text-[24px]">mail</span>
        </div>
        <h1
          class="font-headline-md text-headline-md text-on-surface text-center"
        >
          Reset Password
        </h1>
        <p
          class="font-body-md text-body-md text-on-surface-variant text-center mt-2"
        >
          Enter your details to create a new password.
        </p>
      </div>
      <!-- Form -->
      <form
        class="w-full flex flex-col gap-6"
        action="/resetpassword"
        method="POST"
      >
        <!-- Verification Section -->
        <div class="flex flex-col gap-4">
          <!-- Phone Field -->
          <div class="flex flex-col gap-1">
            <label
              class="font-label-md text-label-md text-on-surface-variant"
              for="phone"
              >Phone Number</label
            >
            <div class="flex gap-2">
              <div class="relative flex-1">
                <span
                  class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
                  >phone_iphone</span
                >
                <input
                  class="w-full h-10 pl-10 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow"
                  id="phone"
                  name="phone"
                  placeholder="+1 (555) 000-0000"
                  type="tel"
                  required
                />
              </div>
              <button
                class="h-10 px-4 whitespace-nowrap rounded-lg border border-outline-variant bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container focus:ring-2 focus:ring-primary/50 transition-colors"
                type="button"
                id="send_otp_btn"
              >
                Send OTP
              </button>
            </div>
          </div>
          <!-- OTP Field -->
          <div class="flex flex-col gap-1">
            <label
              class="font-label-md text-label-md text-on-surface-variant"
              for="otp"
              >OTP Code</label
            >
            <div class="flex gap-2">
              <div class="relative flex-1">
                <span
                  class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
                  >pin</span
                >
                <input
                  class="w-full h-10 pl-10 pr-3 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow"
                  id="otp"
                  name="otp"
                  placeholder="000000"
                  type="text"
                />
              </div>
              <button
                class="h-10 px-4 whitespace-nowrap rounded-lg border border-outline-variant bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container focus:ring-2 focus:ring-primary/50 transition-colors"
                type="button"
                id="verify_otp_btn"
              >
                Verify
              </button>
            </div>
          </div>
        </div>
        <hr class="border-t border-outline-variant" />
        <!-- New Password Section -->
        <div class="flex flex-col gap-4">
          <!-- New Password Field -->
          <div class="flex flex-col gap-1">
            <label
              class="font-label-md text-label-md text-on-surface-variant"
              for="new_password"
              >New Password</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
                >lock</span
              >
              <input
                class="w-full h-10 pl-10 pr-10 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                type="password"
                required
              />
              <button
                class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors"
                type="button"
                onclick="togglePasswordVisibility('new_password', this)"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >visibility_off</span
                >
              </button>
            </div>
          </div>
          <!-- Confirm Password Field -->
          <div class="flex flex-col gap-1">
            <label
              class="font-label-md text-label-md text-on-surface-variant"
              for="confirm_password"
              >Confirm Password</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]"
                >lock</span
              >
              <input
                class="w-full h-10 pl-10 pr-10 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                type="password"
                required
              />
            </div>
          </div>
        </div>
        <!-- Submit Action -->
        <div class="pt-2">
          <button
            class="w-full h-10 rounded-lg bg-primary font-label-md text-label-md text-on-primary hover:bg-on-primary-fixed-variant focus:ring-4 focus:ring-primary/30 transition-all"
            type="submit"
          >
            Reset Password
          </button>
        </div>
        <div class="text-center mt-2">
          <a
            class="font-body-md text-body-md text-primary hover:text-on-primary-fixed-variant transition-colors"
            href="/login"
          >
            Back to Login
          </a>
        </div>
      </form>
    </main>
    <script>
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          btn.querySelector("span").textContent = "visibility";
        } else {
          input.type = "password";
          btn.querySelector("span").textContent = "visibility_off";
        }
      }
      // Mock OTP send/verify
      document
        .getElementById("send_otp_btn")
        .addEventListener("click", function () {
          alert("OTP sent to your phone number (demo)");
        });
      document
        .getElementById("verify_otp_btn")
        .addEventListener("click", function () {
          alert("OTP verified (demo)");
        });
    </script>
  </body>
</html>
